name: Static site audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production files and performance safeguards
        run: |
          node scripts/audit.mjs
          node --test tests/*.test.mjs
