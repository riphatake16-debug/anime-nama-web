<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0e" />
    <script>
      try {
        const saved = localStorage.getItem('animenama:visual-theme:v1');
        const theme = saved === 'day' ? 'day' : 'night';
        document.documentElement.dataset.anTheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'day' ? '#f8f6fb' : '#0b0b0e';
        const motion = localStorage.getItem('animenama:motion');
        if (motion === 'reduced' || motion === 'full') document.documentElement.dataset.motion = motion;
      } catch (_) { document.documentElement.dataset.anTheme = 'night'; }
    </script>
    <link rel="manifest" href="/anime-nama-web/manifest.webmanifest" />
    <link rel="icon" href="/anime-nama-web/favicon.svg" />
    <link rel="apple-touch-icon" href="/anime-nama-web/icons/apple-touch-icon.png" />
    <meta name="description" content="انیمه‌نما — آرشیو و تقویم فارسی انیمه" />
    <title>انیمه‌نما — React source preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
